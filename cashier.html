<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Cashier</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f6f7f9;
            --white: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --dark: #111827;

            --green: #15803d;
            --green-bg: #f0fdf4;

            --orange: #c2410c;
            --orange-bg: #fff7ed;

            --blue: #2563eb;
            --blue-bg: #eff6ff;

            --red: #dc2626;
            --red-bg: #fef2f2;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            height: 70px;
            background: transparent;
            

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            position: sticky;
            padding-top: 30px;
            top: 0;
            z-index: 50;
        }

        .brand strong {
            display: block;
            font-size: 16px;
            font-weight: 800;
        }

        .brand span {
            display: block;
            margin-top: 3px;

            font-size: 10px;
            color: var(--muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cashier-name {
            font-size: 11px;
            color: var(--muted);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;

            padding: 7px 10px;

            border-radius: 999px;

            background: var(--green-bg);
            color: var(--green);

            font-size: 10px;
            font-weight: 700;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: var(--green);
        }

        .logout-btn {
            border: 1px solid var(--border);
            background: white;

            padding: 8px 11px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 11px;
        }

        /* MAIN */

        .main {
            max-width: 1300px;
            margin: auto;
            padding: 22px;
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 20px;
        }

        .page-head h1 {
            font-size: 25px;
            letter-spacing: -.5px;
        }

        .page-head p {
            margin-top: 5px;

            color: var(--muted);

            font-size: 11px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 12px;

            margin-bottom: 18px;
        }

        .stat-card {
            padding: 16px;

            background: white;

            border: 1px solid var(--border);
            border-radius: 13px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;

            color: var(--muted);
        }

        .stat-value {
            margin-top: 7px;

            font-size: 24px;
            font-weight: 800;
        }

        /* BILLING GRID */

        .billing-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 12px;
        }

        .billing-card {
            background: white;

            border: 1px solid var(--border);
            border-radius: 14px;

            padding: 16px;

            cursor: pointer;

            transition: .16s;
        }

        .billing-card:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 22px rgba(0,0,0,.05);
        }

        .billing-card-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .billing-table {
            font-size: 15px;
            font-weight: 800;
        }

        .billing-total {
            font-size: 18px;
            font-weight: 800;
        }

        .billing-bill {
            margin-top: 7px;

            font-size: 10px;
            color: var(--muted);
        }

        .billing-status {
            display: inline-block;

            margin-top: 11px;

            padding: 5px 8px;

            border-radius: 999px;

            background: var(--orange-bg);
            color: var(--orange);

            font-size: 9px;
            font-weight: 700;

            text-transform: uppercase;
        }

        .billing-time {
            margin-top: 9px;

            font-size: 9px;
            color: var(--muted);
        }

        .empty {
            grid-column: 1/-1;

            padding: 50px 20px;

            background: white;

            border: 1px solid var(--border);
            border-radius: 14px;

            text-align: center;

            font-size: 12px;
            color: var(--muted);
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 1000;

            background: rgba(17,24,39,.45);

            align-items: center;
            justify-content: center;

            padding: 18px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 560px;
            max-height: 90vh;

            overflow-y: auto;

            padding: 22px;

            background: white;

            border-radius: 16px;

            box-shadow: 0 20px 50px rgba(0,0,0,.15);
        }

        .modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 18px;
        }

        .modal-head h2 {
            font-size: 18px;
        }

        .modal-sub {
            margin-top: 4px;

            font-size: 10px;
            color: var(--muted);
        }

        .close-btn {
            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 50%;

            background: #f3f4f6;

            cursor: pointer;

            font-size: 17px;
        }

        /* BILL ITEMS */

        .bill-items {
            margin-bottom: 16px;
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            padding: 9px 0;

            border-bottom: 1px solid var(--border);

            font-size: 11px;
        }

        .bill-item-name {
            font-weight: 700;
        }

        .bill-item-meta {
            margin-top: 3px;

            font-size: 9px;
            color: var(--muted);
        }

        /* BILL EDIT */

        .bill-edit-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 8px;

            margin-top: 15px;
        }

        .bill-edit-grid label {
            display: block;

            font-size: 9px;
            font-weight: 700;
        }

        .bill-edit-grid input {
            width: 100%;
            height: 40px;

            margin-top: 6px;

            padding: 0 9px;

            border: 1px solid var(--border);
            border-radius: 8px;

            outline: none;
        }

        .bill-edit-grid input:focus {
            border-color: var(--dark);
        }

        /* SUMMARY */

        .bill-summary {
            margin-top: 16px;

            padding-top: 13px;

            border-top: 1px solid var(--border);
        }

        .bill-summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;

            margin-bottom: 7px;

            font-size: 11px;
        }

        .bill-summary-row.grand {
            margin-top: 12px;

            font-size: 17px;
            font-weight: 800;
        }

        /* PAYMENT */

        .payment-title {
            margin-top: 18px;

            font-size: 11px;
            font-weight: 800;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 7px;

            margin-top: 9px;
        }

        .payment-method {
            padding: 10px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: white;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;
        }

        .payment-method.active {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        .reference-input {
            display: none;

            width: 100%;
            height: 42px;

            margin-top: 10px;

            padding: 0 10px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;
        }

        /* ACTIONS */

        .billing-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;

            margin-top: 17px;
        }

        .billing-actions button {
            height: 43px;

            border: 0;
            border-radius: 9px;

            cursor: pointer;

            font-size: 11px;
            font-weight: 700;
        }

        .update-btn {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .pay-btn {
            background: var(--dark);
            color: white;
        }

        .billing-actions button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* TOAST */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 20px;

            transform: translate(-50%,70px);

            opacity: 0;

            z-index: 1200;

            padding: 11px 15px;

            border-radius: 9px;

            background: #111827;
            color: white;

            font-size: 11px;

            transition: .22s;
        }

        .toast.show {
            transform: translate(-50%,0);
            opacity: 1;
        }

        /* LOADER */

        .loader {
            position: fixed;
            inset: 0;

            z-index: 2000;

            display: grid;
            place-items: center;

            background: white;
        }

        .spinner {
            width: 34px;
            height: 34px;

            border: 3px solid #e5e7eb;
            border-top-color: #111827;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:1000px) {

            .billing-grid {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width:650px) {

            .main {
                padding: 14px;
            }

            .billing-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2,1fr);
            }

            .bill-edit-grid {
                grid-template-columns: 1fr;
            }

            .payment-methods {
                grid-template-columns: repeat(3,1fr);
            }

            .cashier-name {
                display: none;
            }
        }

    </style>
</head>

<body>

<div
    class="loader"
    id="loader"
>
    <div class="spinner"></div>
</div>


<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <strong id="restaurantName">
                Restaurant
            </strong>

            <span>
                Cashier Billing
            </span>

        </div>


        <div class="header-right">

            <div class="live-badge">

                <span class="live-dot"></span>

                Live

            </div>


            <span
                class="cashier-name"
                id="cashierName"
            >
                Cashier
            </span>


            <button
                type="button"
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="main">


        <div class="page-head">

            <div>

                <h1>
                    Billing
                </h1>

                <p>
                    Bill requests appear automatically.
                </p>

            </div>

        </div>


        <!-- STATS -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    Pending Bills
                </div>

                <div
                    class="stat-value"
                    id="pendingBillsCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Pending Amount
                </div>

                <div
                    class="stat-value"
                    id="pendingAmount"
                >
                    ₹0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Billing Now
                </div>

                <div
                    class="stat-value"
                    id="billingNowCount"
                >
                    0
                </div>

            </div>

        </section>


        <!-- BILLS -->

        <section
            class="billing-grid"
            id="billingGrid"
        ></section>

    </main>

</div>


<!-- BILL MODAL -->

<div
    class="modal"
    id="billModal"
>

    <div class="modal-box">

        <div class="modal-head">

            <div>

                <h2 id="billTitle">
                    Bill
                </h2>

                <div
                    class="modal-sub"
                    id="billTableName"
                ></div>

            </div>


            <button
                type="button"
                class="close-btn"
                id="closeBillModal"
            >
                ×
            </button>

        </div>


        <!-- ITEMS -->

        <div
            id="billItems"
        ></div>


        <!-- EDIT VALUES -->

        <div class="bill-edit-grid">

            <label>

                Discount

                <input
                    type="number"
                    id="discountInput"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </label>


            <label>

                Tax

                <input
                    type="number"
                    id="taxInput"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </label>


            <label>

                Service Charge

                <input
                    type="number"
                    id="serviceInput"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </label>

        </div>


        <!-- SUMMARY -->

        <div
            class="bill-summary"
            id="billSummary"
        ></div>


        <!-- PAYMENT -->

        <div class="payment-title">
            Payment Method
        </div>


        <div class="payment-methods">

            <button
                type="button"
                class="payment-method active"
                data-method="cash"
            >
                Cash
            </button>


            <button
                type="button"
                class="payment-method"
                data-method="upi"
            >
                UPI
            </button>


            <button
                type="button"
                class="payment-method"
                data-method="card"
            >
                Card
            </button>

        </div>


        <input
            type="text"
            class="reference-input"
            id="referenceInput"
            placeholder="UPI / Card reference number"
        >


        <!-- ACTIONS -->

        <div class="billing-actions">

            <button
                type="button"
                class="update-btn"
                id="updateBillBtn"
            >
                Update Bill
            </button>


            <button
                type="button"
                class="pay-btn"
                id="completePaymentBtn"
            >
                Complete Payment
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="cashier.js"></script>

</body>
</html>
