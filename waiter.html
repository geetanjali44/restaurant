<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Waiter</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f6f7f9;
            --white: #fff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --dark: #111827;

            --green: #15803d;
            --green-bg: #f0fdf4;

            --blue: #2563eb;
            --blue-bg: #eff6ff;

            --orange: #c2410c;
            --orange-bg: #fff7ed;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            min-height: 100vh;
        }

        .header {
            height: 68px;
            background: transparent;
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            padding-top:25px;
            top: 0;
            z-index: 50;
        }

        .brand strong {
            display: block;
            font-size: 15px;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-size: 11px;
            color: var(--muted);
        }

        .logout {
            border: 1px solid var(--border);
            background: white;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
        }

        .main {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .screen-head {
            margin-bottom: 18px;
        }

        .screen-head h1 {
            font-size: 24px;
        }

        .screen-head p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }

        /* TABLES */

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
        }

        .table-card {
            border: 1px solid var(--border);
            background: white;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            min-height: 120px;
        }

        .table-card:active {
            transform: scale(.98);
        }

        .table-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .table-name {
            font-weight: 800;
            font-size: 15px;
        }

        .table-status {
            font-size: 9px;
            padding: 5px 7px;
            border-radius: 999px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .free {
            background: var(--green-bg);
            color: var(--green);
        }

        .running,
        .occupied,
        .ordering {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .bill_requested,
        .billing {
            background: var(--orange-bg);
            color: var(--orange);
        }

        .table-price {
            font-size: 20px;
            font-weight: 800;
            margin-top: 20px;
        }

        .table-meta {
            font-size: 10px;
            color: var(--muted);
            margin-top: 5px;
        }

        /* ORDER SCREEN */

        .order-layout {
            display: grid;
            grid-template-columns: minmax(0,1fr) 330px;
            gap: 15px;
        }

        .order-main,
        .cart {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .order-main {
            padding: 16px;
        }

        .order-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            border: 1px solid var(--border);
            background: white;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .category-bar {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 12px;
        }

        .category-chip {
            border: 1px solid var(--border);
            background: white;
            padding: 8px 12px;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 10px;
        }

        .category-chip.active {
            background: #111827;
            border-color: #111827;
            color: white;
        }

        .search {
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            margin-bottom: 13px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }

        .menu-card {
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 12px;
        }

        .menu-card.unavailable {
            opacity: .45;
        }

        .menu-name {
            font-weight: 700;
            font-size: 12px;
        }

        .menu-cat {
            color: var(--muted);
            font-size: 9px;
            margin-top: 3px;
        }

        .menu-price {
            font-weight: 800;
            margin-top: 10px;
            font-size: 14px;
        }

        .qty-row {
            margin-top: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-control button {
            width: 29px;
            height: 29px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .qty-value {
            min-width: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
        }

        /* CART */

        .cart {
            padding: 16px;
            height: fit-content;
            position: sticky;
            top: 85px;
        }

        .cart h2 {
            font-size: 15px;
        }

        .existing-order {
            background: #f9fafb;
            border-radius: 10px;
            padding: 11px;
            margin: 12px 0;
        }

        .existing-order h3 {
            font-size: 11px;
            margin-bottom: 8px;
        }

        .existing-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 10px;
            padding: 5px 0;
        }

        .cart-items {
            margin-top: 13px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: 800;
            font-size: 15px;
        }

        .send-btn,
        .bill-btn {
            width: 100%;
            border: 0;
            border-radius: 10px;
            height: 44px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 12px;
        }

        .send-btn {
            background: #111827;
            color: white;
        }

        .bill-btn {
            background: var(--orange-bg);
            color: var(--orange);
        }

        .send-btn:disabled {
            opacity: .5;
        }

        .empty {
            color: var(--muted);
            font-size: 11px;
            padding: 20px 0;
            text-align: center;
        }

        /* TOAST */

        .toast {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translate(-50%,60px);
            background: #111827;
            color: white;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 11px;
            opacity: 0;
            transition: .2s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%,0);
        }

        .loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 200;
            display: grid;
            place-items: center;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #e5e7eb;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:900px) {
            .tables-grid {
                grid-template-columns: repeat(3,1fr);
            }

            .order-layout {
                grid-template-columns: 1fr;
            }

            .cart {
                position: static;
            }
        }

        @media(max-width:600px) {
            .main {
                padding: 14px;
            }

            .tables-grid {
                grid-template-columns: repeat(2,1fr);
            }

            .menu-grid {
                grid-template-columns: repeat(2,1fr);
            }

            .user-name {
                display: none;
            }
        }

        .ready-order-banner {
    display: none;
    align-items: center;
    gap: 12px;

    margin-bottom: 14px;
    padding: 14px 16px;

    background: #f0fdf4;
    border: 1px solid #86efac;
    border-radius: 13px;

    color: #166534;
}

.ready-order-banner.show {
    display: flex;
}

.ready-order-icon {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: #16a34a;
    color: white;

    font-size: 19px;
    font-weight: 800;

    flex-shrink: 0;
}

.ready-order-banner strong {
    display: block;

    font-size: 14px;
    font-weight: 800;
}

.ready-order-banner span {
    display: block;

    margin-top: 3px;

    font-size: 10px;
    color: #15803d;
}
.ready-order-banner.preparing {
    display: flex;
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1d4ed8;
}

.ready-order-banner.preparing .ready-order-icon {
    background: #2563eb;
    color: white;
}

.ready-order-banner.preparing span {
    color: #2563eb;
}

.ready-order-banner.ready {
    display: flex;
    background: #f0fdf4;
    border-color: #86efac;
    color: #166534;
}

.ready-order-banner.ready .ready-order-icon {
    background: #16a34a;
    color: white;
}

.ready-order-banner.ready span {
    color: #15803d;
}

.ready-order-content {
    flex: 1;
    min-width: 0;
}

.mark-served-btn {
    display: none;

    border: 0;
    background: #166534;
    color: white;

    border-radius: 9px;

    padding: 9px 12px;

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    white-space: nowrap;
}

.ready-order-banner.ready .mark-served-btn {
    display: block;
}

.ready-order-banner.preparing .mark-served-btn {
    display: none;
}

.mark-served-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

@media(max-width:600px) {

    .ready-order-banner {
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .mark-served-btn {
        width: 100%;
        margin-top: 4px;
    }
}


    </style>
</head>

<body>

<div class="loader" id="loader">
    <div class="spinner"></div>
</div>


<div class="app">

    <header class="header">

        <div class="brand">

            <strong id="restaurantName">
                Restaurant
            </strong>

            <span>
                Waiter
            </span>

        </div>


        <div class="header-right">

            <span
                class="user-name"
                id="waiterName"
            >
                Waiter
            </span>

            <button
                class="logout"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </header>


    <main class="main">


        <!-- TABLE SCREEN -->

        <section
            class="screen active"
            id="tableScreen"
        >

            <div class="screen-head">

                <h1>
                    Tables
                </h1>

                <p>
                    Select a table to take or update an order.
                </p>

            </div>


            <div
                class="tables-grid"
                id="tablesGrid"
            ></div>

        </section>


        <!-- ORDER SCREEN -->

        <section
            class="screen"
            id="orderScreen"
        >
<div
    class="ready-order-banner"
    id="readyOrderBanner"
>

    <div class="ready-order-icon">
        ✓
    </div>


    <div class="ready-order-content">

        <strong id="readyOrderTitle">
            Order Ready
        </strong>

        <span id="readyOrderText">
            Please serve the order.
        </span>

    </div>


    <button
        type="button"
        class="mark-served-btn"
        id="markServedBtn"
    >
        Mark Served
    </button>

</div>
            <div class="order-layout">

                <div class="order-main">

                    <div class="order-topbar">

                        <div>

                            <button
                                class="back-btn"
                                id="backBtn"
                            >
                                ← Tables
                            </button>

                        </div>


                        <strong id="selectedTableName">
                            Table
                        </strong>

                    </div>


                    <div
                        class="category-bar"
                        id="categoryBar"
                    ></div>


                    <input
                        class="search"
                        id="menuSearch"
                        type="search"
                        placeholder="Search menu..."
                    >


                    <div
                        class="menu-grid"
                        id="menuGrid"
                    ></div>

                </div>


                <aside class="cart">

                    <h2>
                        Order
                    </h2>


                    <div
                        id="existingOrderWrap"
                    ></div>


                    <div
                        class="cart-items"
                        id="cartItems"
                    ></div>


                    <div class="cart-total">

                        <span>
                            New items
                        </span>

                        <span id="cartTotal">
                            ₹0
                        </span>

                    </div>


                    <button
                        class="send-btn"
                        id="sendOrderBtn"
                    >
                        Send Order
                    </button>


                    <button
                        class="bill-btn"
                        id="requestBillBtn"
                        style="display:none"
                    >
                        Request Bill
                    </button>

                </aside>

            </div>

        </section>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="waiter.js"></script>
<script src="mobile-common.js"></script>

</body>
</html>
